<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>多元升学初探画像卡</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: #f9fafb;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .container {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #1a73e8;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }
    label .required {
      color: red;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }
    input.error-border, select.error-border {
      border-color: #d93025 !important;
      box-shadow: 0 0 0 2px rgba(217, 48, 37, 0.2);
    }
    button {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #0d62c9;
    }
    #result {
      margin-top: 24px;
      padding: 16px;
      background: #f1f8ff;
      border-left: 4px solid #1a73e8;
      word-break: break-all;
      display: none;
    }
    .copy-btn {
      margin-top: 10px;
      background: #34a853;
    }
    .error-text {
      color: #d93025;
      font-size: 14px;
      margin-top: 4px;
      min-height: 18px;
    }
    #school-other,
    #social-district,
    #social-other {
      margin-top: 8px;
      display: none;
    }
    .checkbox-flow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .checkbox-flow label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 16px;
      color: #333;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎓 多元升学初探画像卡</h1>
  <p style="text-align:center; color:#666;">请完整填写以下信息，点击【生成我的AI升学提示语】后，再【一键复制】到平板智能体，即可获得【多元升学路径推荐】</p>

  <!-- 就读高中 -->
  <div class="form-group">
    <label>就读高中 <span class="required">*</span></label>
    <select id="school">
      <option value="">请选择</option>
      <option value="博罗县华侨中学">博罗县华侨中学</option>
      <option value="深圳福海中学">深圳福海中学</option>
      <option value="广州中学">广州中学</option>
      <option value="中山纪念中学">中山纪念中学</option>
      <option value="华南师范大学附属中学">华南师范大学附属中学</option>
      <option value="other">其他</option>
    </select>
    <input type="text" id="school-other" placeholder="请输入您的高中名称">
    <div class="error-text" id="err-school"></div>
  </div>

  <!-- 学籍所在地 -->
  <div class="form-group">
    <label>学籍所在地 <span class="required">*</span></label>
    <input type="text" id="location" placeholder="请先选择高中或手动填写" readonly>
    <div class="error-text" id="err-location"></div>
  </div>

  <!-- 户籍类型（两级联动） -->
  <div class="form-group">
	<label>
  户籍所在地（城市必填）<span class="required">*</span><br>
  <small style="font-weight:normal;color:#666;">
    若你的户籍城市在下拉列表中，请选择；若不在，请选“其他”并填写城市名称。<br>
    只有部分城市（如梅州、惠州等）需进一步选择区/县。若你的户籍区/县在下拉框列表中，请选择；若不在，无需选择。
  </small>
</label>
    <select id="social-city" onchange="updateSocialDistrict()">
      <option value="">请选择城市</option>
      <option value="惠州">惠州</option>
      <option value="深圳">深圳</option>
      <option value="广州">广州</option>
      <option value="中山">中山</option>
      <option value="汕头">汕头</option>
      <option value="韶关">韶关</option>
      <option value="河源">河源</option>
      <option value="梅州">梅州</option>
      <option value="汕尾">汕尾</option>
      <option value="阳江">阳江</option>
      <option value="湛江">湛江</option>
      <option value="茂名">茂名</option>
      <option value="清远">清远</option>
      <option value="潮州">潮州</option>
      <option value="揭阳">揭阳</option>
      <option value="云浮">云浮</option>
      <option value="肇庆">肇庆</option>
      <option value="other">其他</option>
    </select>
    <select id="social-district" disabled>
      <option value="">请选择县/区</option>
    </select>
    <input type="text" id="social-other" placeholder="请输入您的户籍城市">
    <div class="error-text" id="err-social"></div>
  </div>

  <div class="form-group">
    <label>民族 <span class="required">*</span></label>
    <select id="ethnicity">
      <option value="">请选择</option>
      <option value="汉族">汉族</option>
      <option value="少数民族">少数民族</option>
    </select>
    <div class="error-text" id="err-ethnicity"></div>
  </div>

  <!-- 性别 -->
  <div class="form-group">
    <label>性别 <span class="required">*</span></label>
    <select id="gender">
      <option value="">请选择</option>
      <option value="男">男</option>
      <option value="女">女</option>
    </select>
    <div class="error-text" id="err-gender"></div>
  </div>

  <!-- 年级 -->
  <div class="form-group">
    <label>当前年级 <span class="required">*</span></label>
    <select id="grade">
      <option value="">请选择</option>
      <option value="高一">高一</option>
      <option value="高二">高二</option>
      <option value="高三">高三</option>
    </select>
    <div class="error-text" id="err-grade"></div>
  </div>

  <!-- 年龄 -->
  <div class="form-group">
    <label>年龄（周岁）<span class="required">*</span></label>
    <select id="age">
      <option value="">请选择</option>
      <option value="小于15周岁">小于15周岁</option>
      <option value="15周岁">15周岁</option>
      <option value="16周岁">16周岁</option>
      <option value="17周岁">17周岁</option>
      <option value="大于17周岁">大于17周岁</option>
    </select>
    <div class="error-text" id="err-age"></div>
  </div>

  <!-- 成绩定位线 -->
  <div class="form-group">
    <label>你当前或努力后有望达到的目标是？ <span class="required">*</span></label>
    <select id="level">
      <option value="">请选择</option>
      <option value="985/211">985/211（不低于600分）</option>
      <option value="特控线">特控线（高考大概540分）</option>
      <option value="本科线">本科线（物理436分/历史464分）</option>
      <option value="专科线">专科线</option>
    </select>
    <div class="error-text" id="err-level"></div>
  </div>

  <!-- 英语成绩 -->
  <div class="form-group">
    <label>英语成绩 <span class="required">*</span></label>
    <input type="number" id="lang" min="0" max="150" placeholder="数字即可，150分制度">
    <div class="error-text" id="err-lang"></div>
  </div>

  <!-- 裸眼视力 -->
  <div class="form-group">
    <label>裸眼视力 <span class="required">*</span></label>
    <select id="vision">
      <option value="">请选择</option>
      <option value="4.8及以上">4.8及以上（近视250以下）</option>
      <option value="4.7">4.7（近视约250~300度）</option>
      <option value="4.6">4.6（近视约300~350度）</option>
      <option value="4.5">4.5（近视约350~450度）</option>
      <option value="4.0-4.4">4.0–4.4（近视约450~850度）</option>
      <option value="低于4.0">低于4.0（近视约850度以上）</option>
    </select>
    <div class="error-text" id="err-vision"></div>
  </div>

  <!-- 身高 -->
  <div class="form-group">
    <label>身高（cm）<span class="required">*</span></label>
    <input type="number" id="height" min="140" max="220" placeholder="例如：175">
    <div class="error-text" id="err-height"></div>
  </div>

  <!-- 色觉 -->
  <div class="form-group">
    <label>色觉状况 <span class="required">*</span></label>
    <select id="colorblind">
      <option value="">请选择</option>
      <option value="正常">正常</option>
      <option value="色盲/色弱">色盲/色弱</option>
    </select>
    <div class="error-text" id="err-colorblind"></div>
  </div>

  <!-- 职业倾向（多选） -->
  <div class="form-group">
    <label>职业倾向(不考虑的方向，无需勾选)</label>
    <div id="career-preference-container" class="checkbox-flow">
      <label><input type="checkbox" value="医学"> 医学</label>
      <label><input type="checkbox" value="教师"> 教师</label>
      <label><input type="checkbox" value="军警公安"> 军警公安</label>
      <label><input type="checkbox" value="飞行员"> 飞行员</label>
      <label><input type="checkbox" value="航海"> 航海</label>
    </div>
  </div>

  <!-- 是否接受定向就业 -->
  <div class="form-group">
    <label>是否接受边远/经济较落后地区的定向就业（6年左右）？<span class="required">*</span></label>
    <select id="directed">
      <option value="">请选择</option>
      <option value="接受定向就业">接受</option>
      <option value="不接受定向就业">不接受</option>
    </select>
    <div class="error-text" id="err-directed"></div>
  </div>

  <!-- 家庭预算 -->
  <div class="form-group">
    <label>家庭可接受的学费范围（每年）<span class="required">*</span></label>
    <select id="budget">
      <option value="">请选择</option>
      <option value="2万以下">2万以下</option>
      <option value="2万~10万">2万~10万</option>
      <option value="10万~15万">10万~15万</option>
      <option value="15万~30万">15万~30万</option>
      <option value="30万以上">30万以上</option>
    </select>
    <div class="error-text" id="err-budget"></div>
  </div>

  <!-- 是否社交型 -->
  <div class="form-group">
    <label>你是否属于“社交型”学生？<br><small style="font-weight:normal;color:#666;">（擅长沟通表达、喜欢团队合作、有组织/演讲/主持等经验）</small><span class="required">*</span></label>
    <select id="social-type">
      <option value="">请选择</option>
      <option value="是">是，我擅长沟通与表达</option>
      <option value="否">否，我更偏向安静或独立工作</option>
    </select>
    <div class="error-text" id="err-social-type"></div>
  </div>

  <!-- 竞赛奖项（新结构） -->
  <div class="form-group">
    <label>竞赛奖项</label>
    <select id="contest-type" onchange="updateAwardLevelOptions()">
      <option value="">请选择竞赛</option>
      <optgroup label="数学类">
        <option value="cmo">全国中学生数学奥林匹克（CMO）</option>
        <option value="math-province">全国高中数学联赛（省级赛区）</option>
      </optgroup>
      <optgroup label="物理类">
        <option value="cpho">全国中学生物理奥林匹克（CPhO）</option>
        <option value="phys-province">全国中学生物理竞赛（省级赛区）</option>
      </optgroup>
      <optgroup label="化学类">
        <option value="ccho">全国中学生化学奥林匹克（CChO）</option>
        <option value="chem-province">全国高中学生化学竞赛（省级赛区）</option>
      </optgroup>
      <optgroup label="生物类">
        <option value="cbo">全国中学生生物学奥林匹克（CBO）</option>
        <option value="bio-province">全国中学生生物学联赛（省级赛区）</option>
      </optgroup>
      <optgroup label="信息学类">
        <option value="noi">全国青少年信息学奥林匹克（NOI）</option>
        <option value="noip">全国青少年信息学奥林匹克联赛（NOIP/省赛）</option>
      </optgroup>
      <optgroup label="其他学术与综合荣誉">
        <option value="innovation-contest">青少年科技创新大赛</option>
        <option value="research-project">研究性学习课题成果</option>
        <option value="merit-student">市级以上三好学生/优秀干部</option>
        <option value="other-academic">其他学术类奖项</option>
        <option value="non-academic">非学科类竞赛（不适用于强基/英才班）</option>
      </optgroup>
    </select>

    <select id="award-level" disabled>
      <option value="">请选择奖项</option>
    </select>
  </div>

  <!-- 艺术或体育特长 -->
  <div class="form-group">
    <label>艺术或体育特长</label>
    <select id="talent">
      <option value="无">无</option>
      <option value="美术与设计">艺术特长：美术与设计</option>
      <option value="音乐（声乐/器乐）">艺术特长：音乐（声乐/器乐）</option>
      <option value="舞蹈">艺术特长：舞蹈</option>
      <option value="播音主持/表演">艺术特长：播音主持/表演</option>
      <option value="书法">艺术特长：书法</option>
      <option value="体育（非专业）">体育特长：体育（非专业）</option>
      <option value="二级及以上运动员">体育特长：二级及以上运动员</option>
    </select>
  </div>

  <button onclick="generatePrompt()">✨ 生成我的AI升学提示语</button>
  <div id="result"></div>
</div>

<script>
  const schoolToLocation = {
	"博罗县华侨中学":"惠州",
    "深圳福海中学": "深圳",
    "广州中学": "广州",
    "中山纪念中学": "中山",
    "华南师范大学附属中学": "广州"
  };

  function updateLocationBySchool() {
    const schoolSelect = document.getElementById('school');
    const locationInput = document.getElementById('location');
    const selectedSchool = schoolSelect.value;

    if (selectedSchool && selectedSchool !== 'other' && schoolToLocation[selectedSchool]) {
      locationInput.value = schoolToLocation[selectedSchool];
      locationInput.readOnly = true;
    } else if (selectedSchool === 'other') {
      locationInput.value = '';
      locationInput.readOnly = false;
    } else {
      locationInput.value = '';
      locationInput.readOnly = false;
    }
  }

  document.getElementById('school').addEventListener('change', function () {
    const otherInput = document.getElementById('school-other');
    if (this.value === 'other') {
      otherInput.style.display = 'block';
      otherInput.focus();
    } else {
      otherInput.style.display = 'none';
      otherInput.value = '';
    }
    updateLocationBySchool();
  });

  window.addEventListener('DOMContentLoaded', () => {
    updateLocationBySchool();
  });

  function getSchoolValue() {
    const selectVal = document.getElementById('school').value;
    if (selectVal === 'other') {
      return document.getElementById('school-other').value.trim();
    }
    return selectVal;
  }

  function getCareerPreferenceValues() {
    const container = document.getElementById('career-preference-container');
    const checked = Array.from(container.querySelectorAll('input[type="checkbox"]:checked'))
      .map(cb => cb.value);
    return checked.length > 0 ? checked.join("、") : "无";
  }

  // ✅ 完整补充后的 socialDistrictMap（覆盖 SPECIAL_AREAS + 常规区）
  const socialDistrictMap = {
    "韶关": ["浈江区", "武江区", "曲江区", "南雄", "乐昌", "仁化", "始兴", "翁源", "新丰", "乳源"],
    "河源": ["源城区", "东源", "龙川", "连平", "和平", "紫金"],
    "梅州": ["梅江区", "梅县区", "兴宁", "大埔", "丰顺", "五华", "平远", "蕉岭"],
    "汕尾": ["城区", "陆丰", "海丰", "陆河"],
    "阳江": ["江城区", "阳东区", "阳西县", "阳春市"],
    "清远": ["清城区", "清新区", "英德", "连州", "佛冈", "阳山", "连南", "连山"],
    "潮州": ["湘桥区", "潮安区", "饶平"],
    "揭阳": ["榕城区", "揭东区", "普宁", "揭西", "惠来"],
    "云浮": ["云城区", "云安区", "罗定", "新兴", "郁南"],
    "惠州": ["惠城区", "惠阳区", "博罗", "惠东", "龙门"],
    "肇庆": ["端州区", "鼎湖区", "高要区", "四会", "广宁", "怀集", "封开", "德庆"]
  };

  function updateSocialDistrict() {
    const citySelect = document.getElementById("social-city");
    const districtSelect = document.getElementById("social-district");
    const otherInput = document.getElementById("social-other");

    const city = citySelect.value;

    districtSelect.innerHTML = '<option value="">请选择县/区</option>';
    districtSelect.style.display = "none";
    districtSelect.disabled = true;
    otherInput.style.display = "none";
    otherInput.value = "";

    if (city === "other") {
      otherInput.style.display = "block";
    } else if (socialDistrictMap[city]) {
      socialDistrictMap[city].forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
      districtSelect.style.display = "block";
      districtSelect.disabled = false;
    }
  }

  function getSocialCityValue() {
    const city = document.getElementById("social-city").value;
    if (city === "other") {
      return document.getElementById("social-other").value.trim();
    }
    return city;
  }

  function getSocialDistrictValue() {
    const city = document.getElementById("social-city").value;
    if (socialDistrictMap[city]) {
      return document.getElementById("social-district").value || "";
    }
    return "";
  }

  // 🏆 新增：竞赛奖项联动逻辑
  const awardLevelMap = {
    "cmo": ["国赛金牌", "国赛银牌", "国赛铜牌", "省队入选"],
    "math-province": ["省一", "省二", "省三"],
    "cpho": ["国赛金牌", "国赛银牌", "国赛铜牌", "省队入选"],
    "phys-province": ["省一", "省二", "省三"],
    "ccho": ["国赛金牌", "国赛银牌", "国赛铜牌", "省队入选"],
    "chem-province": ["省一", "省二", "省三"],
    "cbo": ["国赛金牌", "国赛银牌", "国赛铜牌", "省队入选"],
    "bio-province": ["省一", "省二", "省三"],
    "noi": ["国赛金牌", "国赛银牌", "国赛铜牌", "省队入选"],
    "noip": ["省一", "省二", "省三"],
    "innovation-contest": ["国家级一等奖", "国家级二等奖", "省级一等奖", "省级二等奖", "市级一等奖"],
    "research-project": ["校级优秀", "市级优秀", "省级优秀", "国家级优秀"],
    "merit-student": ["市级三好/优干", "省级三好/优干"],
    "other-academic": ["其他"],
    "non-academic": ["其他"]
  };

  function updateAwardLevelOptions() {
    const contestType = document.getElementById("contest-type").value;
    const awardLevelSelect = document.getElementById("award-level");
    awardLevelSelect.innerHTML = '<option value="">请选择奖项</option>';
    awardLevelSelect.disabled = true;

    if (contestType && awardLevelMap[contestType]) {
      awardLevelMap[contestType].forEach(level => {
        const opt = document.createElement("option");
        opt.value = level;
        opt.textContent = level;
        awardLevelSelect.appendChild(opt);
      });
      awardLevelSelect.disabled = false;
    }
  }

  function getAwardsText() {
    const contest = document.getElementById("contest-type").value;
    const level = document.getElementById("award-level").value;
    if (!contest) return "无";
    const contestLabel = document.querySelector(`#contest-type option[value="${contest}"]`)?.textContent || contest;
    return level ? `${contestLabel} ${level}` : contestLabel;
  }

  function generatePrompt() {
    const fields = [
      {
        id: 'school',
        errId: 'err-school',
        getValue: () => {
          const v = document.getElementById('school').value;
          if (v === 'other') return document.getElementById('school-other').value.trim();
          return v;
        },
        element: () => document.getElementById('school').value === 'other' ? document.getElementById('school-other') : document.getElementById('school')
      },
      {
        id: 'ethnicity',
        errId: 'err-ethnicity',
        getValue: () => document.getElementById('ethnicity').value,
        element: () => document.getElementById('ethnicity')
      },
      {
        id: 'location',
        errId: 'err-location',
        getValue: () => document.getElementById('location').value.trim(),
        element: () => document.getElementById('location')
      },
      {
        id: 'social',
        errId: 'err-social',
        getValue: () => {
          const city = getSocialCityValue();
          if (!city) return "";
          const district = getSocialDistrictValue();
          return district ? city + district : city;
        },
        element: () => {
          const city = document.getElementById('social-city').value;
          if (city === 'other') return document.getElementById('social-other');
          if (socialDistrictMap[city]) return document.getElementById('social-district');
          return document.getElementById('social-city');
        }
      },
      { id: 'gender', errId: 'err-gender', getValue: () => document.getElementById('gender').value, element: () => document.getElementById('gender') },
      { id: 'grade', errId: 'err-grade', getValue: () => document.getElementById('grade').value, element: () => document.getElementById('grade') },
      { id: 'age', errId: 'err-age', getValue: () => document.getElementById('age').value, element: () => document.getElementById('age') },
      { id: 'level', errId: 'err-level', getValue: () => document.getElementById('level').value, element: () => document.getElementById('level') },
      {
        id: 'lang',
        errId: 'err-lang',
        getValue: () => {
          const v = document.getElementById('lang').value.trim();
          return v === '' ? '' : isNaN(v) ? '' : v;
        },
        element: () => document.getElementById('lang')
      },
      { id: 'vision', errId: 'err-vision', getValue: () => document.getElementById('vision').value, element: () => document.getElementById('vision') },
      {
        id: 'height',
        errId: 'err-height',
        getValue: () => {
          const v = document.getElementById('height').value.trim();
          return v === '' ? '' : (isNaN(v) || v < 140 || v > 220) ? '' : v;
        },
        element: () => document.getElementById('height')
      },
      { id: 'colorblind', errId: 'err-colorblind', getValue: () => document.getElementById('colorblind').value, element: () => document.getElementById('colorblind') },
      { id: 'directed', errId: 'err-directed', getValue: () => document.getElementById('directed').value, element: () => document.getElementById('directed') },
      { id: 'budget', errId: 'err-budget', getValue: () => document.getElementById('budget').value, element: () => document.getElementById('budget') },
      { id: 'social-type', errId: 'err-social-type', getValue: () => document.getElementById('social-type').value, element: () => document.getElementById('social-type') }
    ];

    document.querySelectorAll('.error-text').forEach(el => el.textContent = '');
    document.querySelectorAll('.error-border').forEach(el => el.classList.remove('error-border'));

    let firstErrorElement = null;
    for (const field of fields) {
      const value = field.getValue();
      const el = field.element();
      if (!value) {
        el.classList.add('error-border');
        document.getElementById(field.errId).textContent = '此项为必填';
        if (!firstErrorElement) firstErrorElement = el;
      }
    }

    if (firstErrorElement) {
      firstErrorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
      firstErrorElement.focus();
      return;
    }

    const school = "就读高中：" + getSchoolValue() + "；";
    const location = "学籍所在地：" + document.getElementById('location').value.trim() + "；";
    const socialCity = getSocialCityValue();
    const socialDistrict = getSocialDistrictValue();
    const hukou = "户籍所在地：" + (socialDistrict ? socialCity + socialDistrict : socialCity) + "；";
    const ethnicityText = "民族：" + document.getElementById('ethnicity').value + "；";
    const gender = "性别：" + document.getElementById('gender').value + "；";
    const grade = "当前年级：" + document.getElementById('grade').value + "；";
    const ageRaw = document.getElementById('age').value;
    const ageNum = ageRaw.includes("15") ? "15" : ageRaw.includes("16") ? "16" : ageRaw.includes("17") ? "17" : ageRaw.includes("小于") ? "14" : "18";
    const age = "年龄：" + ageNum + "；";
    const levelMap = {
      "985/211": "985/211",
      "特控线": "特控线",
      "本科线": "本科线",
      "专科线": "专科线"
    };
    const level = "分数线：" + levelMap[document.getElementById('level').value] + "；";
    const lang = "英语成绩：" + document.getElementById('lang').value.trim() + "；";
    const vision = "裸眼视力：" + document.getElementById('vision').options[document.getElementById('vision').selectedIndex].textContent.split("（")[0].trim() + "；";
    const height = "身高：" + document.getElementById('height').value + "；";
    
    // ✅ 使用新竞赛奖项文本
    const awards = "竞赛奖项：" + getAwardsText() + "；";
    
    const talent = "特长：" + (document.getElementById('talent').value === "无" ? "无" : document.getElementById('talent').value.replace("艺术特长：", "").replace("体育特长：", "")) + "；";
    const career = "考虑的职业方向：" + getCareerPreferenceValues() + "；";
    const directed = "定向意愿：" + (document.getElementById('directed').value === "接受定向就业" ? "愿意" : "不愿意") + "；";
    const socialTypeText = "是否社交型：" + (document.getElementById('social-type').value === "是" ? "是" : "否") + "；";
    const colorblindText = "色觉状况：" + document.getElementById('colorblind').value + "；";

    const budgetRaw = document.getElementById('budget').value;
    let budgetText = "";
    if (budgetRaw === "2万以下") budgetText = "2万以下";
    else if (budgetRaw === "2万~10万") budgetText = "10万以下";
    else if (budgetRaw === "10万~15万") budgetText = "15万以下";
    else if (budgetRaw === "15万~30万") budgetText = "30万以下";
    else if (budgetRaw === "30万以上") budgetText = "30万以上";
    const budget = "家庭可接受的学费范围：" + budgetText;

    const prompt = [
      school, location, hukou, ethnicityText, gender, grade, age,
      level, lang, vision, height, awards, talent,
      career, directed, socialTypeText, colorblindText, budget
    ].join("");

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `
      <p><strong>你的AI升学提示语：</strong></p>
      <div id="prompt-text" style="font-family: monospace; white-space: pre-wrap; word-break: break-all;">${prompt}</div>
      <button class="copy-btn" onclick="copyText()">📋 一键复制</button>
    `;
    resultDiv.style.display = 'block';
  }

  function copyText() {
    const text = document.getElementById('prompt-text').textContent;
    let copied = false;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => copied = true).catch(() => copied = fallbackCopy(text));
    } else {
      copied = fallbackCopy(text);
    }

    setTimeout(() => {
      if (copied) {
        alert('✅ 已复制！即将跳转至智能体平台...');
        // window.location.href = 'https://zt-rc.xdsy.cn/pages/index/index';
		  window.history.back(); // ← 返回上一页
      } else {
        alert('⚠️ 请手动复制文本后再前往智能体平台');
      }
    }, 100);
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '-9999px';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta);
    ta.select();
    const success = document.execCommand('copy');
    document.body.removeChild(ta);
    return success;
  }
</script>
</body>
</html>
